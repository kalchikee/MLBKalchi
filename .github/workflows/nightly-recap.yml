name: Nightly Recap (grade yesterday's predictions)

# Walks every ungraded predictions/*.json file and grades each pick
# against the MLB Stats API. Updates data/grading_history.json and
# commits it so the morning briefing can read the season hit rate.
# Runs at 09:00 UTC (~4 AM CT / 5 AM ET) so it catches West-Coast games
# that finish past midnight ET.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # needs to commit data/grading_history.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Grade ungraded predictions
        run: node --loader ts-node/esm src/actions/recap.ts

      - name: Commit graded history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grading_history.json || true
          if ! git diff --staged --quiet; then
            git commit -m "MLB recap: grade ungraded predictions"
            git push
          else
            echo "No new gradings to commit"
          fi
